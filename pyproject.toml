[build-system]
requires = ["setuptools>=77", "wheel", "torch>=2.0.0", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "metal-causal-conv"
version = "0.1.0"
description = "Stateful causal depthwise convolution Metal kernel for Apple Silicon with PyTorch/MPS"
authors = [
    {name = "Çağatay Çallı", email = "cagataycalli@gmail.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ninja",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]
